<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>中正大學吃什麼？ — 嘉義 CCU 美食轉盤</title>

  <meta name="description" content="中正大學學生的選餐轉盤：92 間校內、神農路、裕農路餐廳，依台北時間判斷營業狀態，用「想吃什麼」標籤篩選，離線也能用。" />
  <link rel="canonical" href="https://charliechiu39.github.io/Don-t-know-what-to-eat-/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://charliechiu39.github.io/Don-t-know-what-to-eat-/" />
  <meta property="og:title" content="中正大學吃什麼？🎡" />
  <meta property="og:description" content="轉出你今天的命運餐廳！92 間中正大學周邊美食，即時判斷營業中。" />
  <meta property="og:image" content="https://charliechiu39.github.io/Don-t-know-what-to-eat-/assets/og-image.png" />
  <meta property="og:locale" content="zh_TW" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="color-scheme" content="dark" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 中文用系統字型（PingFang／微軟正黑體／Noto CJK），只為英文標語非同步載入 Orbitron 的字母子集 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap&text=SPINYOURFATE" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="preload" href="data/restaurants.json" as="fetch" crossorigin="anonymous" />
  <script type="module" src="js/app.js"></script>
  <!-- 攤平 ES module 的瀑布式載入 -->
  <link rel="modulepreload" href="js/core/catalog.js" />
  <link rel="modulepreload" href="js/core/filters.js" />
  <link rel="modulepreload" href="js/core/format.js" />
  <link rel="modulepreload" href="js/core/hours.js" />
  <link rel="modulepreload" href="js/core/picker.js" />
  <link rel="modulepreload" href="js/core/storage.js" />
  <link rel="modulepreload" href="js/core/url-state.js" />
  <link rel="modulepreload" href="js/ui/effects.js" />
  <link rel="modulepreload" href="js/ui/wheel.js" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "中正大學吃什麼？",
    "description": "幫中正大學學生隨機決定今天吃什麼的選餐轉盤，收錄校園周邊 92 間餐廳並判斷營業狀態。",
    "url": "https://charliechiu39.github.io/Don-t-know-what-to-eat-/",
    "applicationCategory": "LifestyleApplication",
    "operatingSystem": "Web Browser",
    "inLanguage": "zh-TW",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TWD" },
    "author": { "@type": "Person", "name": "CharlieChiu39" }
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#spin-btn">跳到轉盤</a>

  <!-- 開場：每個分頁工作階段只出現一次，可點擊或按任意鍵略過 -->
  <div id="splash" class="splash" hidden>
    <div class="splash-content">
      <p id="splash-text" class="splash-title"></p>
      <p class="splash-hint">點擊任意處進入</p>
    </div>
  </div>

  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

  <main class="app">
    <header class="app-header">
      <div class="header-icon" aria-hidden="true">🎡</div>
      <h1 class="glitch-title" data-text="中正大學吃什麼？">中正大學吃什麼？</h1>
      <p class="tagline">— SPIN YOUR FATE —</p>
      <p id="now-line" class="now-line" aria-live="off"></p>
    </header>

    <div class="layout">
      <section class="stage" aria-labelledby="stage-title">
        <h2 id="stage-title" class="sr-only">轉盤</h2>

        <div id="meal-tabs" class="meal-tabs" role="group" aria-label="餐別"></div>

        <div class="wheel-wrapper">
          <canvas id="wheel-canvas" role="img" aria-label="餐廳轉盤"></canvas>
          <div class="wheel-pointer" aria-hidden="true"></div>
        </div>
        <p id="wheel-legend" class="wheel-legend" hidden>扇形越窄＝最近吃過，抽中機率較低</p>

        <button id="list-btn" type="button" class="pill-btn">
          查看本輪 <span id="count">0</span> 間選項<span id="excluded-note"></span> ›
        </button>

        <label class="open-only-pill">
          <input id="open-only" type="checkbox" class="open-only-input" checked />
          <span class="open-only-track" aria-hidden="true"><span class="open-only-thumb"></span></span>
          <span>只顯示營業中</span>
        </label>

        <div class="spin-row">
          <button id="lucky-btn" type="button" class="lucky-btn">Lucky <span aria-hidden="true">🎲</span><span class="sr-only">：倒數三秒後自動轉動</span></button>
          <button id="spin-btn" type="button" class="spin-btn">轉！</button>
        </div>

        <div id="empty-state" class="empty-state" hidden>
          <p class="empty-emoji" aria-hidden="true">😵</p>
          <p id="empty-text">沒有符合條件的店家</p>
          <button id="relax-btn" type="button" class="link-btn">一鍵放寬條件</button>
        </div>
      </section>

      <aside class="side" aria-label="篩選與紀錄">
        <details id="filter-panel" class="panel">
          <summary class="panel-summary">
            <span>篩選條件</span>
            <span id="filter-count" class="filter-count" hidden></span>
            <span class="panel-chevron" aria-hidden="true">▾</span>
          </summary>

          <div class="panel-body">
            <fieldset class="field">
              <legend>想吃什麼 <span class="legend-hint">可複選</span></legend>
              <div id="tag-chips" class="chips"></div>
            </fieldset>
            <fieldset class="field">
              <legend>飲食需求</legend>
              <div id="diet-chips" class="chips"></div>
            </fieldset>
            <fieldset class="field">
              <legend>區域</legend>
              <div id="area-chips" class="chips"></div>
            </fieldset>
            <fieldset class="field">
              <legend>價位</legend>
              <div id="price-chips" class="chips"></div>
            </fieldset>
            <fieldset class="field">
              <legend>進階</legend>
              <label class="switch-row">
                <input id="verified-only" type="checkbox" />
                <span>只看已查證營業時間的店</span>
              </label>
              <label class="switch-row">
                <input id="weighting" type="checkbox" />
                <span>降低最近吃過的抽中率</span>
              </label>
            </fieldset>
            <div class="panel-footer">
              <button id="reset-btn" type="button" class="link-btn">重設篩選</button>
              <button id="blocked-btn" type="button" class="link-btn link-danger">封鎖清單（<span id="blocked-count">0</span>）</button>
            </div>
          </div>
        </details>

        <section id="recent-box" class="panel recent" aria-labelledby="recent-title" hidden>
          <div class="recent-head">
            <h2 id="recent-title" class="recent-title">最近吃過</h2>
            <button id="clear-recent-btn" type="button" class="link-btn">清除</button>
          </div>
          <ol id="recent-list" class="recent-list"></ol>
        </section>

        <p class="data-note">
          <span id="data-summary">載入資料中…</span>
          <a href="https://github.com/CharlieChiu39/Don-t-know-what-to-eat-/blob/main/docs/restaurant-audit.md" target="_blank" rel="noopener">查核紀錄</a>
        </p>
      </aside>
    </div>

    <footer class="app-footer">
      <a href="https://github.com/CharlieChiu39/Don-t-know-what-to-eat-" target="_blank" rel="noopener">GitHub</a>
      <span aria-hidden="true">·</span>
      <span>營業時間僅供參考，出發前請向店家確認</span>
    </footer>
  </main>

  <!-- 本輪選項 -->
  <dialog id="list-dialog" class="sheet" aria-labelledby="list-title">
    <div class="sheet-head">
      <h2 id="list-title" class="sheet-title">本輪選項</h2>
      <p class="sheet-sub">取消勾選可暫時排除，只影響這一輪</p>
    </div>
    <ul id="list" class="item-list"></ul>
    <form method="dialog" class="sheet-foot">
      <button class="primary-btn" value="apply">套用並關閉</button>
    </form>
  </dialog>

  <!-- 抽選結果 -->
  <dialog id="result-dialog" class="sheet result" aria-labelledby="result-name" aria-describedby="result-status">
    <form method="dialog" class="sheet-close"><button aria-label="關閉">✕</button></form>
    <div class="result-emoji" aria-hidden="true"><span id="result-emoji">🍜</span></div>
    <p class="eyebrow">今天就吃</p>
    <h2 id="result-name" class="result-name" tabindex="-1" autofocus></h2>
    <div class="badges">
      <span id="result-cuisine" class="badge badge-cuisine"></span>
      <span id="result-price" class="badge badge-price"></span>
      <span id="result-area" class="badge badge-area"></span>
    </div>
    <ul id="result-tags" class="tag-list" aria-label="標籤"></ul>
    <div id="result-status" class="status-card" data-tone="unknown">
      <span class="status-dot" aria-hidden="true"></span>
      <strong id="result-status-badge"></strong>
      <span id="result-status-detail" class="status-detail"></span>
    </div>
    <p id="result-note" class="result-note"></p>
    <p id="result-address" class="result-meta" hidden></p>
    <p id="result-source" class="result-meta"></p>
    <div class="result-actions">
      <a id="map-link" class="map-btn" href="#" target="_blank" rel="noopener">🗺️ 看地圖</a>
      <button id="eat-btn" type="button" class="primary-btn">就吃這間 ✓</button>
    </div>
    <div class="result-secondary">
      <button id="block-btn" type="button" class="ghost-btn ghost-danger">不想吃這間</button>
      <button id="respin-btn" type="button" class="ghost-btn">再轉一次 🎲</button>
      <button id="share-btn" type="button" class="ghost-btn">分享 🔗</button>
    </div>
  </dialog>

  <!-- 封鎖清單 -->
  <dialog id="blocked-dialog" class="sheet" aria-labelledby="blocked-title">
    <div class="sheet-head">
      <h2 id="blocked-title" class="sheet-title">封鎖清單</h2>
      <p class="sheet-sub">封鎖的店不會出現在轉盤上</p>
    </div>
    <ul id="blocked-list" class="item-list"></ul>
    <form method="dialog" class="sheet-foot sheet-foot-split">
      <button id="unblock-all-btn" type="button" class="ghost-btn ghost-danger">全部恢復</button>
      <button class="primary-btn">完成</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sr-announcer" class="sr-only" aria-live="assertive"></div>
  <div id="screen-flash" class="screen-flash" aria-hidden="true"></div>

  <noscript><p class="noscript">這個網站需要 JavaScript 才能轉動轉盤。</p></noscript>
</body>
</html>
