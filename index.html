<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>中正大學吃什麼？ — 嘉義 CCU 美食轉盤</title>

  <!-- SEO: Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />

  <meta name="twitter:description" content="轉出你今天的命運餐廳！80+ 間嘉義中正大學周邊美食。" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>" />

  <!-- PWA / Mobile -->
  <meta name="theme-color" content="#00bbff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon:  { DEFAULT: '#00bbff', dim: '#0077aa' },
            cyber: { DEFAULT: '#9b5de5', dark: '#6a35b0' },
            void:  { DEFAULT: '#0a0a0f', card: '#12121a', border: '#1e1e2e' },
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-bg min-h-screen">

  <!-- ══════════════════════════════════════════
       LOADING SCREEN
  ══════════════════════════════════════════ -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center cursor-pointer select-none">
    <img src="assets/assetsbg.jpg" alt="" class="absolute inset-0 w-full h-full object-cover" />
    <div class="absolute inset-0 bg-black/50"></div>
    <div class="relative z-10 text-center px-6">
      <p id="loading-meal-text" class="text-5xl sm:text-7xl font-black text-white drop-shadow-lg tracking-wide leading-tight"></p>
      <p class="mt-4 text-white/70 text-base font-medium animate-pulse">點擊任意處進入</p>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       MAIN APP
  ══════════════════════════════════════════ -->
  <div id="app" class="hidden max-w-md mx-auto px-4 pb-24 app-enter">

    <!-- Header -->
    <header class="pt-8 pb-4 text-center">
      <div class="header-icon-wrap mx-auto mb-2">
        <p class="text-4xl">🎡</p>
      </div>
      <h1 class="glitch-title text-2xl font-black tracking-tight" data-text="中正大學吃什麼？">中正大學吃什麼？</h1>
      <p class="text-xs mt-1 font-medium" style="color:#00bbff;opacity:0.7;letter-spacing:0.12em;">— SPIN YOUR FATE —</p>
    </header>

    <!-- Quick meal tabs -->
    <div class="flex gap-1.5 mb-5">
      <button class="meal-tab active" data-meal="all">全部 🍽️</button>
      <button class="meal-tab" data-meal="breakfast">🌅 早餐</button>
      <button class="meal-tab" data-meal="lunch">☀️ 午餐</button>
      <button class="meal-tab" data-meal="dinner">🌙 晚餐</button>
      <button class="meal-tab" data-meal="latenight">🌃 宵夜</button>
    </div>

    <!-- Wheel canvas -->
    <div class="relative flex justify-center mb-3">
      <div class="wheel-wrapper">
        <canvas id="wheel-canvas" width="320" height="320" role="img" aria-label="餐廳轉盤"></canvas>
        <!-- Pointer (CSS triangle) -->
        <div class="wheel-pointer"></div>
      </div>
    </div>

    <!-- View items button -->
    <div class="flex justify-center mb-3">
      <button id="view-items-btn" class="view-items-btn">
        查看本輪 <span id="wheel-count">0</span> 間選項 ›
      </button>
    </div>

    <!-- Open-only toggle pill — 永遠可見 -->
    <div class="flex justify-center mb-4">
      <label for="open-only-toggle" class="open-only-pill">
        <input type="checkbox" id="open-only-toggle" class="open-only-pill-input" checked />
        <span class="open-only-pill-track">
          <span class="open-only-pill-thumb"></span>
        </span>
        <span class="open-only-pill-text">只顯示營業中</span>
      </label>
    </div>

    <!-- Spin button -->
    <div class="flex justify-center gap-3 mb-5 items-center">
      <button id="lucky-btn" class="lucky-btn" aria-label="3秒後自動轉動">Lucky 🎲</button>
      <button id="spin-btn" class="spin-btn" aria-label="轉動轉盤選擇餐廳">
        <span id="spin-btn-text">轉！</span>
      </button>
    </div>

    <!-- Filter panel (collapsible) -->
    <details class="filter-panel mb-4" id="filter-details">
      <summary class="filter-summary">
        <span>篩選條件</span>
        <span id="filter-badge" class="filter-badge hidden">●</span>
        <span class="ml-auto text-xs" style="color:#444;">展開 ▾</span>
      </summary>
      <div class="pt-3 space-y-3">
        <!-- Price -->
        <div>
          <p class="text-xs font-semibold mb-1" style="color:#555;">價位</p>
          <div class="flex gap-2 flex-wrap">
            <button class="filter-chip active" data-type="price" data-value="all">不限</button>
            <button class="filter-chip" data-type="price" data-value="cheap">&lt;80元</button>
            <button class="filter-chip" data-type="price" data-value="medium">80-150元</button>
            <button class="filter-chip" data-type="price" data-value="expensive">&gt;150元</button>
          </div>
        </div>
        <!-- Cuisine -->
        <div>
          <p class="text-xs font-semibold mb-1" style="color:#555;">料理類型</p>
          <div class="flex gap-2 flex-wrap" id="cuisine-chips">
            <button class="filter-chip active" data-type="cuisine" data-value="all">不限</button>
            <button class="filter-chip" data-type="cuisine" data-value="台式">台式</button>
            <button class="filter-chip" data-type="cuisine" data-value="日式">日式</button>
            <button class="filter-chip" data-type="cuisine" data-value="韓式">韓式</button>
            <button class="filter-chip" data-type="cuisine" data-value="越式">越式</button>
            <button class="filter-chip" data-type="cuisine" data-value="泰式">泰式</button>
            <button class="filter-chip" data-type="cuisine" data-value="西式">西式</button>
            <button class="filter-chip" data-type="cuisine" data-value="亞洲">亞洲</button>
            <button class="filter-chip" data-type="cuisine" data-value="速食">速食</button>
            <button class="filter-chip" data-type="cuisine" data-value="火鍋">火鍋</button>
            <button class="filter-chip" data-type="cuisine" data-value="飲料">飲料</button>
            <button class="filter-chip" data-type="cuisine" data-value="甜點">甜點</button>
            <button class="filter-chip" data-type="cuisine" data-value="咖啡">咖啡</button>
            <button class="filter-chip" data-type="cuisine" data-value="素食">素食</button>
            <button class="filter-chip" data-type="cuisine" data-value="清真">清真</button>
            <button class="filter-chip" data-type="cuisine" data-value="便利商店">超商</button>
          </div>
        </div>
        <!-- Clear blocked -->
        <div class="pt-1" style="border-top:1px solid #1e1e2e;">
          <button id="clear-blocked-btn" class="text-xs transition-colors" style="color:#ff6b6b;">
            清除封鎖清單 (<span id="blocked-count">0</span> 間)
          </button>
        </div>
      </div>
    </details>

    <!-- Share row -->
    <div class="flex gap-3 mb-2">
      <button id="share-btn" class="flex-1 flex items-center justify-center gap-2 py-3 rounded-xl font-semibold text-sm transition-colors shadow-sm hidden" style="border:1px solid #1e1e2e;color:#888;background:#12121a;">
        🔗 分享結果
      </button>
    </div>

    <!-- No results notice -->
    <div id="no-results" class="hidden text-center py-6 text-sm" style="color:#00bbff;opacity:0.7;">
      <p class="text-4xl mb-2">😵</p>
      <p>沒有符合條件的店家，試著放寬篩選條件！</p>
    </div>

  </div>

  <!-- ══════════════════════════════════════════
       ITEMS MODAL
  ══════════════════════════════════════════ -->
  <div id="items-modal" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50" id="items-overlay"></div>
    <div class="items-card relative z-10 w-full max-w-sm rounded-3xl shadow-2xl flex flex-col" style="max-height:75vh;background:#12121a;border:1px solid #1e1e2e;">
      <div class="p-5 pb-3 text-center" style="border-bottom:1px solid #1e1e2e;">
        <h3 class="text-lg font-black" style="color:#e0e0e0;">本輪選項</h3>
        <p class="text-xs mt-0.5" style="color:#555;">輪盤目前包含這些店家</p>
      </div>
      <ul id="items-list" class="overflow-y-auto flex-1 p-4 space-y-2"></ul>
      <div class="p-4 pt-3" style="border-top:1px solid #1e1e2e;">
        <button id="close-items-btn" class="w-full py-2.5 rounded-xl text-white text-sm font-semibold transition-colors shadow" style="background:linear-gradient(135deg,#00bbff,#9b5de5);">
          套用並關閉
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       RESULT MODAL
  ══════════════════════════════════════════ -->
  <div id="result-modal" class="hidden fixed inset-0 z-40 flex items-end sm:items-center justify-center p-4">
    <div class="result-overlay absolute inset-0 bg-black/50" id="result-overlay"></div>
    <div class="result-card relative z-10 w-full max-w-sm rounded-3xl p-6 shadow-2xl result-slide-up" style="background:#12121a;border:1px solid #1e1e2e;">
      <div class="text-center mb-4">
        <div class="result-emoji-wrap mx-auto mb-3">
          <p class="text-5xl" id="result-emoji">🍜</p>
        </div>
        <h2 class="text-2xl font-black mb-1" id="result-name" style="color:#ffffff;">餐廳名稱</h2>
        <div class="flex items-center justify-center gap-2 flex-wrap mb-2">
          <span class="badge-cuisine" id="result-cuisine">台式</span>
          <span class="badge-price" id="result-price">銅板</span>
          <span class="badge-location" id="result-location">神農路</span>
        </div>
        <p class="text-sm" id="result-note" style="color:#666;"></p>
        <p class="text-xs font-medium mt-1 hidden" id="result-hours" style="color:#00ff88;"></p>
      </div>
      <a id="map-btn" href="#" target="_blank" rel="noopener" class="map-btn">
        🗺️ 在 Google Maps 查看
      </a>
      <div class="flex gap-3 mt-3">
        <button id="block-btn" class="flex-1 py-3 rounded-xl text-sm font-semibold transition-colors" style="border:1px solid rgba(239,68,68,0.4);color:#ff6b6b;background:transparent;">
          不想吃這間 ✕
        </button>
        <button id="respin-btn" class="flex-1 py-3 rounded-xl text-white text-sm font-bold transition-colors shadow" style="background:linear-gradient(135deg,#00bbff,#9b5de5);">
          再轉一次 🎲
        </button>
      </div>
      <button id="close-result-btn" class="mt-3 w-full py-2 text-sm transition-colors" style="color:#444;">
        關閉
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       TOAST NOTIFICATION
  ══════════════════════════════════════════ -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[60] hidden">
    <div class="text-white px-5 py-3 rounded-full text-sm font-medium shadow-lg" id="toast-text" style="background:#12121a;border:1px solid #00bbff;box-shadow:0 0 12px rgba(0,187,255,0.3);"></div>
  </div>

  <!-- Screen flash overlay -->
  <div id="screen-flash"></div>

  <!-- Scripts -->
  <script src="data/restaurants.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/app.js"></script>

</body>
